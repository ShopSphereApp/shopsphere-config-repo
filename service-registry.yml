spring:
  main:
    allow-bean-definition-overriding: true

logging:
  level:
    com.netflix.eureka: INFO
    com.netflix.discovery: INFO

eureka:
  instance:
    hostname: localhost
  client:
    register-with-eureka: false
    fetch-registry: false
  server:
    enable-self-preservation: true
    eviction-interval-timer-in-ms: 60000

