spring:
  config:
    import: optional:configserver:http://localhost:8888
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: customer-service
          uri: lb://customer-soe-service
          predicates:
            - Path=/api/v1/customers/**
        - id: user-service
          uri: lb://user-domain-service
          predicates:
            - Path=/api/v1/users/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

logging:
  level:
    org.springframework.cloud.gateway: INFO
    org.springframework.security: INFO

jwt:
  secret: your-256-bit-secret-key-your-256-bit-secret-key
  expiration: 86400000